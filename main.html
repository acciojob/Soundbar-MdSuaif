<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            height: 100vh;
            width: 100ch;
            display: flex;
            align-items: center;
            background-color: #A164DF;
        }
        #buttons{
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            width: 100%;
            height: 50%;
        }
        .btn{
            width: 100px;
            height: 50px;
            background-color: #663399;
            color: white;
            border-radius: 10px;
        }
        .stop{
             width: 100px;
            height: 50px;
            background-color: #663399;
            color: white;
            border-radius: 10px;
        }
    </style>

</head>
<body>

    <section id="buttons">
        <div>
            <button class="btn">applause</button>
            <audio >
                <source src="./sounds/vvqne-applause-383901.mp3" type="audio/mpeg">
            </audio>
        </div>
        <div>
            <button class="btn">boo</button>
            <audio >
                <source src="./sounds/freesound_community-boo-6377.mp3" type="audio/mpeg">
            </audio>
        </div>
        <div>
            <button class="btn">gasp</button>
            <audio >
                <source src="./sounds/dragon-studio-gasp-sfx-351568.mp3" type="audio/mpeg">
            </audio>
        </div>
        <div>
            <button class="btn">tada</button>
            <audio >
                <source src="./sounds/freesound_community-tada-fanfare-a-6313.mp3" type="audio/mpeg">
            </audio>
        </div>
        <div>
            <button class="btn">victory</button>
            <audio >
                <source src="./sounds/emand_edroff-victory-bell-success-fanfare-576275.mp3" type="audio/mpeg">
            </audio>
        </div>
        <div>
            <button class="btn">wrong</button>
            <audio >
                <source src="./sounds/freesound_community-wrong-47985.mp3" type="audio/mpeg">
            </audio>
        </div>
        <div>
            <button class="stop">stop</button>
        </div>
    </section>

        <script>
        const btn = document.querySelectorAll(".btn")
        const audios = document.querySelectorAll("audio");
        const stop = document.querySelector(".stop")

        btn.forEach((bt,index)=>{
            bt.addEventListener("click",()=>{
                audios.forEach((audio) => {
                    audio.pause();
                    audio.currentTime = 0;
                });
                audios[index].play();
            })
        })

        stop.addEventListener("click",()=>{
            audios.forEach((audio) => {
                audio.pause();
                audio.currentTime = 0;
            });

        })
    

</script>
    
</body>
</html>
